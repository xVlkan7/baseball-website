<!doctype html>

<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Baseball Practice Coordinator</title>

    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.3/dist/leaflet.css"
    />

    <style>
      :root {
        color-scheme: light;
        font-family:
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          sans-serif;
        color: #17211b;
        background: #f4f1e8;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        background: #f4f1e8;
      }

      header {
        padding: 1.5rem clamp(1rem, 4vw, 3rem);
        background: #173f2a;
        color: #fffdf5;
      }

      h1 {
        margin: 0;
        font-size: clamp(1.6rem, 4vw, 2.5rem);
      }

      header p {
        margin: 0.35rem 0 0;
        color: #d8e7d7;
      }

      .container {
        display: flex;
        flex-direction: column;
        min-height: calc(100vh - 116px);
      }

      .map-container {
        width: 100%;
        min-height: 55vh;
      }

      .checklist {
        padding: 1.25rem;
        background: #fffdf5;
      }

      .checklist h2 {
        margin: 0;
        font-size: 1.1rem;
      }

      .checklist p {
        margin: 0.4rem 0 1rem;
        color: #526057;
      }

      #participant-list {
        display: grid;
        gap: 0.65rem;
        padding: 0;
        margin: 0;
        list-style: none;
      }

      #participant-list label {
        display: block;
        padding: 0.8rem;
        border: 1px solid #d8ded3;
        border-radius: 6px;
        cursor: pointer;
      }

      #participant-list label:has(input:checked) {
        border-color: #26734d;
        background: #e8f2e7;
      }

      @media (min-width: 768px) {
        .container {
          flex-direction: row;
        }

        .checklist {
          width: min(360px, 32%);
        }

        .map-container {
          width: 68%;
          height: auto;
          min-height: 0;
        }
      }
    </style>
  </head>

  <body>
    <header>
      <h1>Baseball Practice Coordinator</h1>
      <p>Select players to find a convenient practice midpoint.</p>
    </header>

    <div class="container">
      <div class="checklist">
        <h2>Players</h2>
        <p id="selection-summary">Select at least one player.</p>
        <ul id="participant-list"></ul>
      </div>

      <div id="map" class="map-container"></div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.3/dist/leaflet.js"></script>
    <script src="scripts.js"></script>
  </body>
</html>
