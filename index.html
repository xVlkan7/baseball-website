<!doctype html>

<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Baseball Practice Coordinator</title>

    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.3/dist/leaflet.css"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>

  <body>
    <header>
      <h1>Baseball Practice Coordinator</h1>
      <p>Select players to find a convenient practice midpoint.</p>
    </header>

    <div class="container">
      <div class="checklist">
        <h2>Players</h2>
        <p id="selection-summary">Select at least two players.</p>
        <ul id="participant-list"></ul>
      </div>

      <div id="map" class="map-container"></div>
    </div>

    <section class="notes-section" aria-labelledby="notes-heading">
      <h2 id="notes-heading">Practice notes</h2>
      <form id="notes-form">
        <label for="practice-notes">Keep a note for your next practice</label>
        <textarea
          id="practice-notes"
          name="practice-notes"
          placeholder="Write your practice plan, reminders, or ideas here..."
        ></textarea>
        <button type="submit">Save notes</button>
      </form>
      <p id="notes-status" role="status" aria-live="polite"></p>
    </section>

    <footer>Relax... these aren't your real addresses. &#128517;</footer>

    <script src="https://unpkg.com/leaflet@1.9.3/dist/leaflet.js"></script>
    <script src="scripts.js"></script>
  </body>
</html>
