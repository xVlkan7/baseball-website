<!doctype html>

<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Baseball Practice Coordinator</title>

    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.3/dist/leaflet.css"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>

  <body>
    <header>
      <h1>Baseball Practice Coordinator</h1>
      <p>Select players to find a convenient practice midpoint.</p>
    </header>

    <div class="container">
      <div class="checklist">
        <h2>Players</h2>
        <p id="selection-summary">Select at least two players.</p>
        <ul id="participant-list"></ul>
      </div>

      <div id="map" class="map-container"></div>
    </div>
    <footer>Relax... these aren't your real addresses. &#128517;</footer>

    <script src="https://unpkg.com/leaflet@1.9.3/dist/leaflet.js"></script>
    <script src="scripts.js"></script>
  </body>
</html>
